name: Build NFL Live Debug APK

on:
  push:
    branches: [main, feature/access-control-phase1]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk NFL-LIVE-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFL-LIVE-debug-apk
          path: NFL-LIVE-debug.apk
          if-no-files-found: error
          retention-days: 30
